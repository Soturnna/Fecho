name: Compilar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agente-windows:
    name: Agente do Windows (testes + .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Compilar o componente de desbloqueio (C++)
        run: |
          cmake -S credprovider -B credprovider/build -A x64
          cmake --build credprovider/build --config Release
          New-Item -ItemType Directory -Force -Path agent/Fecho.Agent/Resources | Out-Null
          Copy-Item credprovider/build/Release/FechoCredentialProvider.dll agent/Fecho.Agent/Resources/FechoCredentialProvider.dll -Force
          Get-Item agent/Fecho.Agent/Resources/FechoCredentialProvider.dll | Select-Object Name,Length

      - name: Testes de segurança do protocolo
        run: dotnet run --project agent/Fecho.Core.Tests -c Release

      - name: Publicar Fecho.exe
        run: dotnet publish agent/Fecho.Agent/Fecho.Agent.csproj -c Release -o out

      - uses: actions/upload-artifact@v5
        with:
          name: Fecho-Windows
          path: out/Fecho.exe
          if-no-files-found: error

  app-iphone:
    name: App do iPhone (.ipa sem assinatura)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Escolher o Xcode mais novo
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "SDK do iOS: $SDK"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error::O app usa APIs do iOS 26 (Liquid Glass). Este runner não tem o SDK 26."
            exit 1
          fi

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto
        working-directory: ios
        run: xcodegen generate

      - name: Compilar
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Fecho.xcodeproj \
            -scheme Fecho \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*Fecho/|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Fecho.app

      - name: Empacotar .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Fecho.app Payload/
          zip -qry Fecho.ipa Payload

      - uses: actions/upload-artifact@v5
        with:
          name: Fecho-iPhone
          path: ios/Fecho.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: log-xcodebuild
          path: ios/build.log

  versao:
    name: Publicar versão para download
    needs: [agente-windows, app-iphone]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Criar versão com o .exe e o .ipa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            dist/Fecho-Windows/Fecho.exe \
            dist/Fecho-iPhone/Fecho.ipa \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Fecho — build ${{ github.run_number }}" \
            --latest \
            --notes "Compilado automaticamente a partir de ${{ github.sha }}.

          - **Fecho.exe**: agente do Windows. Rode no PC e marque só Redes privadas no aviso do firewall.
          - **Fecho.ipa**: app do iPhone sem assinatura. Instale pelo iloader."
