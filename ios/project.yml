name: Fecho
options:
  bundleIdPrefix: com.soturnna
  deploymentTarget:
    iOS: "26.0"
    watchOS: "11.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Fecho:
    type: application
    platform: iOS
    sources:
      - path: Fecho
    dependencies:
      - target: FechoWidgets
      - target: FechoWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soturnna.fecho
        PRODUCT_NAME: Fecho
        INFOPLIST_FILE: Fecho/Info.plist
        CODE_SIGN_ENTITLEMENTS: Fecho/Fecho.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  FechoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Fecho/Network
      - path: Fecho/Security
      - path: Fecho/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soturnna.fecho.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
  FechoWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soturnna.fecho.watchkitapp
        INFOPLIST_FILE: Watch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/Watch.entitlements
schemes:
  Fecho:
    build:
      targets:
        Fecho: all
